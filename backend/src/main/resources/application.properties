server.port=${PORT:8081}
spring.application.name=blood-share

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/bloodshare}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:local-development-secret-change-before-deploy}
jwt.expiration-ms=86400000

app.cors.origins=${APP_CORS_ORIGINS:http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
